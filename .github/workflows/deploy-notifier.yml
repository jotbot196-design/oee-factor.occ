name: Deploy notifier (Cloudflare)

on:
  push:
    branches: [main]
    paths: ['notifier/**', '.github/workflows/deploy-notifier.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: notifier
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ยังไม่ได้ตั้ง Secret CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID"; exit 1
          fi

      - name: Test
        run: node --no-warnings test/test.mjs

      - name: Install wrangler
        run: npm install --no-audit --no-fund --no-save wrangler@4

      - name: Find or create KV namespace
        run: |
          NAME=oee-notify-store
          ID=$(npx wrangler kv namespace list | jq -r --arg n "$NAME" '.[] | select(.title==$n) | .id' | head -1)
          if [ -z "$ID" ]; then
            npx wrangler kv namespace create "$NAME"
            ID=$(npx wrangler kv namespace list | jq -r --arg n "$NAME" '.[] | select(.title==$n) | .id' | head -1)
          fi
          echo "KV id: $ID"
          sed -i "s/__KV_ID__/$ID/" wrangler.toml

      - name: Deploy
        run: npx wrangler deploy

      - name: Set Firebase key secret
        env:
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
        run: printf '%s' "$FCM_SERVICE_ACCOUNT" | npx wrangler secret put FCM_SERVICE_ACCOUNT
