name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '.github/workflows/pages.yml'
      - 'push-test/**'
      - 'backend-addon/**'
      - 'notifier/**'
      - '.github/workflows/notify-test.yml'
      - '.github/workflows/deploy-notifier.yml'
      - '.github/workflows/push-test.yml'
      - '.github/workflows/notify-update.yml'
      - '.github/workflows/notifier-debug.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      OEE_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install packages
        run: npm ci

      - name: Sync web config into Android project
        run: npx cap sync android

      - name: Prepare signing key (if secret OEE_SIGNING is set)
        id: sign
        env:
          OEE_SIGNING: ${{ secrets.OEE_SIGNING }}
        run: |
          if [ -n "$OEE_SIGNING" ]; then
            PW=$(printf '%s' "$OEE_SIGNING" | jq -r .password)
            echo "::add-mask::$PW"
            printf '%s' "$OEE_SIGNING" | jq -r .keystore | base64 -d > "$RUNNER_TEMP/oee.jks"
            {
              echo "OEE_KEYSTORE_FILE=$RUNNER_TEMP/oee.jks"
              echo "OEE_KEYSTORE_PASSWORD=$PW"
              echo "OEE_KEY_PASSWORD=$PW"
              echo "OEE_KEY_ALIAS=$(printf '%s' "$OEE_SIGNING" | jq -r .alias)"
            } >> "$GITHUB_ENV"
            echo "task=assembleRelease" >> "$GITHUB_OUTPUT"
            echo "dir=release" >> "$GITHUB_OUTPUT"
            echo "Signing with permanent key"
          else
            echo "No OEE_SIGNING secret: building debug-signed APK"
            echo "task=assembleDebug" >> "$GITHUB_OUTPUT"
            echo "dir=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon ${{ steps.sign.outputs.task }}

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/${{ steps.sign.outputs.dir }}/*.apk "out/OEE-v1.0.${{ github.run_number }}.apk"
          # ชื่อคงที่ สำหรับลิงก์ดาวน์โหลดในหน้าติดตั้ง (releases/latest/download/OEE.apk)
          cp "out/OEE-v1.0.${{ github.run_number }}.apk" out/OEE.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: OEE-apk
          path: out/*.apk

      - name: Publish release (download link for phones)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: OEE v1.0.${{ github.run_number }}
          files: out/*.apk
          body: |
            ดาวน์โหลดไฟล์ .apk ด้านล่างแล้วติดตั้งบนมือถือ Android
            (ครั้งแรกต้องอนุญาต "ติดตั้งแอปจากแหล่งที่ไม่รู้จัก")
