name: Notifier debug
on:
  push:
    branches: [main]
    paths: ['push-test/notifier-debug.txt']
  workflow_dispatch:
jobs:
  debug:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund --no-save wrangler@4
      - name: KV keys (token values hidden)
        run: |
          ID=$(npx wrangler kv namespace list | jq -r '.[]|select(.title=="oee-notify-store")|.id')
          echo "KV=$ID"
          npx wrangler kv key list --namespace-id "$ID" --remote | jq -r '.[].name' | sed -E 's/^(tok:.{8}).*/\1…/'
          echo "--- status:"; npx wrangler kv key get status --namespace-id "$ID" --remote || true
          echo; echo "--- seen:"; npx wrangler kv key get seen:mtn --namespace-id "$ID" --remote || true
          echo; echo "--- website alerts:"; curl -sS "https://oee.sasatornua.workers.dev/api/kv?path=maintenance-alerts" | jq -c '.value | (if type=="array" then . else [.[]] end) | map({id,machine,status,ts,startTs})'
          echo "--- downtime-log last 3:"; curl -sS "https://oee.sasatornua.workers.dev/api/kv?path=downtime-log" | jq -c '.value | (if type=="array" then . else [.[]] end) | sort_by(.endTs) | .[-3:] | map({id,machine,startTs,endTs})'
      - name: Endpoints
        run: |
          U=$(jq -r .notifyUrl docs/app-config.json)
          curl -sS "$U/"; echo; curl -sS "$U/status"; echo; curl -sS "$U/kick"; echo
      - name: Live site
        run: bash push-test/live-site.sh
      - name: Tail 75s
        run: |
          cd notifier
          timeout 75 npx wrangler tail oee-notify --format pretty | sed -E 's/(tok:|token":")[A-Za-z0-9:_-]{12,}/\1***/g' || true
